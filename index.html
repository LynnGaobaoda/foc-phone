<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="空调" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F2F2F7" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>空调</title>
  <style>
    html, body { margin: 0; background: #F2F2F7; color: #1C1C1E; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
    header { padding: calc(8px + env(safe-area-inset-top)) 20px 0; }
    .title-row { display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: 0.2px; }
    #reload { border: 0; background: transparent; color: #007AFF; font-size: 17px; padding: 8px 0; }
    #reload:active { opacity: 0.55; }
    #st { margin: 4px 0 0; min-height: 1.2em; font-size: 13px; color: #8E8E93; }
    #hint { margin: 6px 0 0; font-size: 13px; color: #8E8E93; }
    main { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
    .card { background: #fff; border-radius: 16px; margin: 0 0 20px; }
    .hero { text-align: center; padding: 22px 16px 18px; }
    .temp { font-size: 76px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
    .temp span { font-size: 28px; font-weight: 300; }
    .mode-label { margin-top: 4px; font-size: 15px; color: #8E8E93; }
    .row { display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 18px; }
    .round { width: 52px; height: 52px; border-radius: 26px; border: 0; background: #F2F2F7; color: #007AFF; font-size: 28px; font-weight: 300; }
    .round:active, .power:active, .seg button:active, .cell:active { opacity: 0.55; }
    .power { width: 52px; height: 52px; border-radius: 26px; border: 0; background: #F2F2F7; color: #FF3B30; font-size: 15px; font-weight: 600; }
    .power.on { background: #007AFF; color: #fff; }
    .group-title { margin: 0 16px 6px; font-size: 13px; color: #8E8E93; }
    .seg { display: flex; margin: 0 12px 12px; padding: 2px; background: #E5E5EA; border-radius: 10px; }
    .seg button { flex: 1; border: 0; background: transparent; color: #1C1C1E; font-size: 13px; font-weight: 500; padding: 7px 0; border-radius: 8px; }
    .seg button.on { background: #fff; }
    .cell { display: flex; width: 100%; align-items: center; justify-content: space-between; border: 0; background: #fff; padding: 12px 16px; font-size: 17px; color: #1C1C1E; border-top: 0.5px solid #E5E5EA; }
    .cell:first-of-type { border-top: 0; }
    .cell .val { color: #8E8E93; font-size: 17px; }
    details { margin-top: 8px; }
    summary { font-size: 13px; color: #8E8E93; padding: 0 4px 8px; }
    .motor { display: grid; grid-template-columns: 1fr 1fr; }
    .motor button { border: 0; border-top: 0.5px solid #E5E5EA; background: #fff; padding: 14px 8px; font-size: 15px; color: #007AFF; }
    .motor button:nth-child(odd) { border-right: 0.5px solid #E5E5EA; }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>空调</h1>
      <button type="button" id="reload">刷新</button>
    </div>
    <div id="st">已连接</div>
    <p id="hint" hidden>点底部分享，选「添加到主屏幕」。</p>
  </header>
  <main>
    <section class="card hero">
      <div class="temp" id="temp">27<span>°</span></div>
      <div class="mode-label" id="modeLabel">制热</div>
      <div class="row">
        <button class="round" type="button" id="tdn">−</button>
        <button class="power" type="button" id="power">开</button>
        <button class="round" type="button" id="tup">+</button>
      </div>
    </section>
    <div class="group-title">模式</div>
    <section class="card">
      <div class="seg" id="modes"></div>
    </section>
    <div class="group-title">风量</div>
    <section class="card">
      <div class="seg" id="fans"></div>
    </section>
    <div class="group-title">更多</div>
    <section class="card" id="more"></section>
    <details>
      <summary>电机</summary>
      <section class="card motor" id="motor"></section>
    </details>
  </main>
  <script>
    var UID = "0fbccb9795484b8aa7a811a65f80f95d";
    var TOPIC = "foc001";
    var temp = 27;
    var powerOn = false;
    var mode = "heat";
    var fan = "fauto";
    var st = document.getElementById("st");
    var hint = document.getElementById("hint");
    if (!window.navigator.standalone) hint.hidden = false;

    var MODES = [["自动","auto"],["制冷","cool"],["制热","heat"],["除湿","dry"],["送风","fan"]];
    var FANS = [["自动","fauto"],["低","flow"],["中","fmed"],["高","fhi"]];
    var MORE = [["上下扫风","ac sv"],["左右扫风","ac sh"],["强力","ac turbo"],["静音","ac quiet"],["灯光","ac light"]];
    var MOTOR = [["帮助","help"],["读状态","stat"],["棘轮","r"],["停止保持","stop"],["顺时针 60°","cw"],["逆时针 60°","ccw"],["恒速 +3","spd 3"],["恒速 -3","spd -3"],["恒力 +1100","force 1100"],["恒力 -1100","force -1100"],["位置保持","pos"],["位置 90°","pos 90"],["方向 CW","dir cw"],["方向 CCW","dir ccw"]];

    function send(cmd) {
      st.textContent = "发送中";
      var url = "https://apis.bemfa.com/va/sendMessage?uid=" + UID
        + "&topic=" + encodeURIComponent(TOPIC)
        + "&type=1&msg=" + encodeURIComponent(cmd);
      fetch(url).then(function (r) { return r.text(); }).then(function (t) {
        st.textContent = t.indexOf('"code":0') >= 0 ? "已发送" : t;
      }).catch(function () { st.textContent = "发送失败"; });
    }
    function paint() {
      document.getElementById("temp").innerHTML = temp + "<span>°</span>";
      var name = "制热";
      MODES.forEach(function (m) { if (m[1] === mode) name = m[0]; });
      document.getElementById("modeLabel").textContent = name;
      var p = document.getElementById("power");
      p.textContent = powerOn ? "关" : "开";
      p.className = powerOn ? "power on" : "power";
      document.querySelectorAll("#modes button").forEach(function (b) {
        b.className = b.getAttribute("data-id") === mode ? "on" : "";
      });
      document.querySelectorAll("#fans button").forEach(function (b) {
        b.className = b.getAttribute("data-id") === fan ? "on" : "";
      });
    }
    function seg(parent, items, pick) {
      items.forEach(function (item) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = item[0];
        b.setAttribute("data-id", item[1]);
        b.addEventListener("click", function () { pick(item[1]); });
        parent.appendChild(b);
      });
    }
    seg(document.getElementById("modes"), MODES, function (id) {
      mode = id; powerOn = true; paint(); send("ac " + id);
    });
    seg(document.getElementById("fans"), FANS, function (id) {
      fan = id; powerOn = true; paint(); send("ac " + id);
    });
    document.getElementById("tup").addEventListener("click", function () {
      if (temp < 32) temp++;
      powerOn = true; paint(); send("ac tup");
    });
    document.getElementById("tdn").addEventListener("click", function () {
      if (temp > 16) temp--;
      powerOn = true; paint(); send("ac tdn");
    });
    document.getElementById("power").addEventListener("click", function () {
      powerOn = !powerOn; paint(); send(powerOn ? "ac on" : "ac off");
    });
    MORE.forEach(function (item) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cell";
      b.innerHTML = "<span>" + item[0] + "</span><span class='val'>切换</span>";
      b.addEventListener("click", function () { powerOn = true; paint(); send(item[1]); });
      document.getElementById("more").appendChild(b);
    });
    MOTOR.forEach(function (item) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = item[0];
      b.addEventListener("click", function () { send(item[1]); });
      document.getElementById("motor").appendChild(b);
    });
    document.getElementById("reload").addEventListener("click", function () {
      location.replace(location.pathname + "?v=" + Date.now());
    });
    paint();
  </script>
</body>
</html>
